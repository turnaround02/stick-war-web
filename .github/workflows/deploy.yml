# M5c T4: GitHub Pages deploy (spec §7.4 / M5c §A Q12).
#
# Official artifact flow: build -> actions/upload-pages-artifact ->
# actions/deploy-pages. Triggered on push to `master` (the only branch
# this repo uses; see AGENTS.md "当前状态" — all milestones land on master).
#
# The PR branch does NOT publish. A Pages site is only refreshed when a
# push lands on master, which is the expected behaviour for a static game.
#
# The repository must have "Settings -> Pages -> Source -> GitHub Actions"
# enabled before the first deploy succeeds; this file does not itself
# flip that setting.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

# Allow only one concurrent deployment; older runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
